name: Update profile contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - scripts/update-github-heatmap.mjs
      - .github/workflows/github-heatmap.yml

permissions:
  contents: write

concurrency:
  group: profile-contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'arifr404/arifr404'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/update-github-heatmap.mjs
      - name: Commit calendar changes
        shell: bash
        run: |
          git add assets/github/stats/heatmap.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile contribution calendar"
          git push
